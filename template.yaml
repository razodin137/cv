# CV entry template.
#
# To add an entry:
#   1. mkdir <new-directory>            (directory name becomes the category badge)
#   2. cp template.yaml <new-directory>/<entry-name>.yaml
#   3. Fill in the fields, drop logo/images files into the same directory
#   4. python3 build.py                  (refreshes index.html)
#
# Keep all 14 keys — blank fields are fine (blank list items are dropped).
# This file lives at the root, so the build ignores it; only */*.yaml entries load.

entry_type: job            # job | volunteer | education | events | ministry | creative | career_break
company:                  # Organization name (or leave blank if role says it all)
role:                     # Job title / role / activity
employment_type:           # full-time | part-time | contract | seasonal | intern (free text)
industry:                  # e.g. hospitality, ministry, food service, education
start: "YYYY-MM"           # e.g. "2024-05" — always quote it
end: "YYYY-MM"             # e.g. "2024-12"; leave blank for "Present"
location:                  # City
country:                   # Country name
location_type:             # onsite | remote | hybrid (free text)
accomplishments:           # Bullet points; delete the lines you don't use
 -
 -
 -
skills:                    # Short skill tags
 -
 -
 -
logo:                      # Logo filename — put the file in logos/ or this entry's directory
images:                    # Photo filenames — put the files in this entry's directory
 -
 -