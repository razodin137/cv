# CV entry template.
#
# To add an entry:
#   1. mkdir <new-directory>            (directory name becomes the category badge)
#   2. cp template.yaml <new-directory>/<entry-name>.yaml
#   3. Fill in the fields, drop logo/images files into the same directory
#   4. python3 build.py                  (refreshes index.html)
#
# Keep all 17 keys — blank fields are fine (blank list items are dropped).
# This file lives at the root, so the build ignores it; only */*.yaml entries load.

entry_type: job            # job | volunteer | education | events | ministry | creative | career_break
                           # | organization (an umbrella entry, e.g. a club, that sub-events parent to)
milestone: false           # true = one-off point event: renders as a single timeline line
                           # (the event title in company: is the headline; role and organization
                           # stay secondary); click/tap expands a circular detail view
featured: false            # true = highlight this entry in gold with a star in the top-right
                           # corner (collapsed milestones show the star at the far right)
parent:                      # Slug of a parent entity: its directory (e.g. mae-fah-luang-university)
                             # or, for an umbrella like a club or team, its YAML file name
                             # (e.g. mfu-christian-club). Links to it both ways: "under …" on
                             # milestone lines, a collapsible Events strip on the parent card;
                             # inherits the parent's logo when this entry's logo is blank
company:                  # Organization name; for a milestone, the event title that headlines the line
role:                     # Job title / role / activity
employment_type:           # full-time | part-time | contract | seasonal | intern (free text)
industry:                  # e.g. hospitality, ministry, food service, education
start: "YYYY-MM"           # e.g. "2024-05" — always quote it; full "YYYY-MM-DD" dates work too
end: "YYYY-MM"             # e.g. "2024-12"; leave blank for "Present"
location:                  # City
country:                   # Country name
location_type:             # onsite | remote | hybrid (free text)
accomplishments:           # Bullet points; delete the lines you don't use
 -
 -
 -
skills:                    # Short skill tags
 -
 -
 -
logo:                      # Logo filename — put the file in logos/ or this entry's directory
images:                    # Photo filenames — put the files in this entry's directory
 -
 -