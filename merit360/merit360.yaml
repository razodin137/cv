 - World Merit features 100's of participants from more than 80+ countries. We all met together in the UK for several weeks in August 2017 after nearly a year of collaborating and working together online across various teams.
 - We delivered a proposal at Parliament. Kind of a big deal.
 - WorldMerit 360 is an organization that sponsors projects among the United Nations' Sustainable Development Goals (SDGs). As part of SDG12 (Sustainable Consumption and Production), we led a team of 5 working hybrid both onsite and remote across 5 different countries in order to create a project which was presented at the British Parliament in September of 2017. The House of Lords generously hosted our presentation on the reduction of food waste in restaurants and we were well-received for our hard work.
