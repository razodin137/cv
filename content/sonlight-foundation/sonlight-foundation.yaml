accomplishments:
 - Christ-centered community development for the tribal communities of Naan province, northern Thailand — faith, education and practical support, working toward a future the communities can sustain themselves.
 - Four program areas from the foundation's own proposal — family relief (rice, household goods, scholarships, school supplies), community enterprise (mushroom-growing income, zero-waste goals, bamboo as a replacement for the corn that drives deforestation and PM2.5 smoke), schools (English teaching with visiting volunteers, Christmas events, a Saturday school for tutoring), and hospitals (monthly patient transport, plus nutrition and health education with the hospital's public-health team).
