accomplishments:
 - A team of foreign volunteers came to assist at the prison. I was there to serve as an interpreter and translator between the staff, prisoners, and volunteers while they engaged in an educational seminar.
 - At Ruen Jam, non-violent, well-behaved offenders are given the chance to earn work experience, and learn valuable skills. They work while they are finishing their sentencing, usually during the last several months to a year of their incarceration.
 - There, the incarcerated participate in gardening, Thai handicrafts, and even operation of a small cafe and bistro. They return to their dormitory at the end of the work day and continue their prison sentence.
